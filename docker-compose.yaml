services:
  tesla-http-proxy:
    build:
      context: .
      dockerfile: Dockerfile.tesla-http-proxy
      args:
        # Upstream teslamotors/vehicle-command release. Change both together —
        # the build verifies the tag still resolves to this commit.
        VEHICLE_COMMAND_VERSION: v0.4.1
        VEHICLE_COMMAND_SHA: 49977a18fd68567501d59e16a6c9e4a8b9348544
    container_name: tesla-http-proxy
    volumes:
      - ./certs:/app/certs:ro
    ports:
      - "4443:4443"
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  tesla-smart-charger:
    build:
      context: .
      dockerfile: Dockerfile.tesla-smart-charger
    container_name: tesla-smart-charger
    volumes:
      # Persistent config directory (new v2 format: system.json + vehicles.json)
      - ./config:/app/config
      # Persistent database
      - ./data:/app/data
      # TLS certs for the proxy
      - ./certs:/app/certs:ro
    ports:
      - "8000:8000"
    environment:
      - TESLA_CERTS_DIR=/app/certs
      - TESLA_PROXY_URL=https://tesla-http-proxy:4443
      - TZ=Europe/Lisbon
    restart: unless-stopped
    depends_on:
      - tesla-http-proxy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
